[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
anyhow = "1"
futures = "0.3"
gpui = "=0.2.2"
ignore = "0.4"
lsp = { path = "crates/lsp" }
lsp-types = "0.97"
nucleo-matcher = "0.3"
parking_lot = "0.12"
percent-encoding = "2"
# LF-only line indexing; CR before LF is handled by `text::Buffer`.
ropey = { version = "1.6", default-features = false, features = ["simd"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syntax = { path = "crates/syntax" }
text = { path = "crates/text" }
tree-sitter = "0.27"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-sequel = "0.3"
unicode-segmentation = "1"
url = "2"
