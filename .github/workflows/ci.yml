name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request cancels its older runs; runs on main finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: smaller target directories and faster links on the runners.
  CARGO_PROFILE_DEV_DEBUG: 0
  RUST_BACKTRACE: 1
  LINUX_DEPS: >-
    build-essential pkg-config cmake clang libclang-dev libfontconfig-dev
    libfreetype-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev
    libx11-dev libxcb1-dev libssl-dev libvulkan-dev libzstd-dev

jobs:
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # `-D warnings` reaches workspace members only; vendor/gpui keeps its warnings.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: Test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-latest }
          # The runner's LLVM puts an lldb-dap on PATH that never answers, so the
          # LLDB end-to-end test (which skips without an adapter) is left out.
          - { name: Windows, os: windows-latest, skip: --skip headless_mode_debugs_a_cargo_binary_with_lldb }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends $LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          # The headless tests drive a real rust-analyzer.
          components: rust-analyzer
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --locked --no-fail-fast -- ${{ matrix.skip }}
