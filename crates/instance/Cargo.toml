[package]
name = "instance"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
# Named pipes (the version gpui uses: no second copy).
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    # `ConnectNamedPipe` takes an OVERLAPPED pointer, declared under IO.
    "Win32_System_IO",
    "Win32_System_Pipes",
] }
