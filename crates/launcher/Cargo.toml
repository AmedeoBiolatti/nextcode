[package]
name = "next_code_launcher"
version.workspace = true
edition.workspace = true
publish.workspace = true

# The program users run: a small executable (no gpui) that hands the
# command line to the running editor, or starts `next_code_editor`.
[[bin]]
name = "next_code"
path = "src/main.rs"

[dependencies]
dirs.workspace = true
instance.workspace = true

[build-dependencies]
# Icon and version info (`build.rs`), as the editor has.
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Threading",
] }
