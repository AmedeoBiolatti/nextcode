[package]
name = "next_code"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
dap.workspace = true
dirs.workspace = true
futures.workspace = true
gpui.workspace = true
ignore.workspace = true
language.workspace = true
lsp.workspace = true
nucleo-matcher.workspace = true
parking_lot.workspace = true
regex.workspace = true
serde.workspace = true
search.workspace = true
serde_json.workspace = true
# Already in the tree (git): minimal edits for formatter output.
similar.workspace = true
spell.workspace = true
syntax.workspace = true
terminal.workspace = true
text.workspace = true
unicode-width.workspace = true
watcher.workspace = true
remote.workspace = true
worktree.workspace = true
git.workspace = true
devcontainer.workspace = true
python.workspace = true
run.workspace = true
workflow.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
# Port forwarding tests relay through an in-process agent.
next_code_agent = { path = "../agent" }

[build-dependencies]
# Same version gpui uses: icon and version info (`build.rs`).
embed-resource = "3.0"

[target.'cfg(windows)'.dependencies]
# The version gpui uses (no second copy): startup warm-up (`startup::prewarm`),
# Recycle Bin deletes (`project::trash_local`).
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_DirectWrite",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_UI_Shell",
] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
] }

[target.'cfg(unix)'.dependencies]
# Already in the tree (alacritty_terminal): clean exit on SIGTERM/SIGINT.
signal-hook = "0.4"
